# Catalog skeleton example.
#
# Copy this file to `.mozyo-bridge/docs/catalog.yaml` and replace the
# placeholder entries with project-specific docs and file_conventions.
# All `documents[].canonical_path` entries must resolve to real files in
# the repo; the validator (`mozyo-bridge docs validate`) will reject
# dangling canonical paths.

schema_version: 1
managed_types:
  - rule
  - spec
  - logic
  - manual_spec
  - task

# Optional. Repo-relative directories that
# `mozyo-bridge docs validate --check-file-coverage` walks to assert
# every important source file matches at least one file_convention.
# Drop or extend per project; `--coverage-root` on the CLI takes
# precedence when given. Missing roots stay informational (notice,
# no exit 1).
coverage_roots:
  - app
  - assets/javascripts/epic_ladder/src
  - config
  - lib
  - spec

documents:
  - id: rule-mozyo-bridge-development-flow
    type: rule
    status: active
    canonical_path: .mozyo-bridge/rules/development_flow.md
    purpose: agent 役割、編集権限、gate schema、Codex direct edit gate、完了条件の正本。
    audit_role: mozyo_bridge_master_rule
    related_document_refs:
      - rule-llm-rule-authoring
      - rule-docs-catalog-governance

  - id: rule-llm-rule-authoring
    type: rule
    status: active
    canonical_path: .mozyo-bridge/rules/llm_rule_authoring.md
    purpose: LLM agent が読む規約文書の正本分離、形式選択、gate 構造化、検証接続の正本。
    audit_role: llm_rule_authoring_rule
    related_document_refs:
      - rule-mozyo-bridge-development-flow
      - rule-docs-catalog-governance

  - id: rule-docs-catalog-governance
    type: rule
    status: active
    canonical_path: .mozyo-bridge/rules/docs_catalog_governance.yaml
    purpose: docs catalog、生成物、resolver、audit-doc impact tooling の統治正本。
    audit_role: docs_catalog_governance_rule
    related_document_refs:
      - rule-mozyo-bridge-development-flow
      - rule-llm-rule-authoring

  - id: spec-epic-ladder-readme
    type: spec
    status: active
    canonical_path: README.md
    purpose: Epic Ladder plugin の機能、インストール、運用、MCP 連携の利用者向け正本。
    audit_role: plugin_overview_spec
    related_document_refs:
      - rule-mozyo-bridge-development-flow

  - id: spec-epic-ladder-frontend-readme
    type: spec
    status: active
    canonical_path: assets/javascripts/epic_ladder/README.md
    purpose: Epic Ladder frontend の構成、開発、テスト、build 手順の正本。
    audit_role: frontend_spec
    related_document_refs:
      - spec-epic-ladder-readme

file_conventions:
  - id: fc-agent-guardrails
    name: agent guardrail docs
    patterns:
      - AGENTS.md
      - CLAUDE.md
      - .mozyo-bridge/rules/**
      - .mozyo-bridge/docs/catalog.yaml
      - .mozyo-bridge/docs/file_conventions.generated.yaml
      - .claude/skills/**
      - .codex/skills/**
    severity: block
    document_refs:
      - rule-mozyo-bridge-development-flow
      - rule-llm-rule-authoring
      - rule-docs-catalog-governance

  - id: fc-core-domain-logic
    name: Epic Ladder core domain logic
    patterns:
      - app/models/epic_ladder/version_date_manager.rb
      - app/models/epic_ladder/tracker_hierarchy.rb
      - app/models/epic_ladder/issue_promoter.rb
      - app/models/epic_ladder/project_setting.rb
      - app/models/epic_ladder/mcp_tool_hint.rb
      - spec/models/epic_ladder/version_date_manager_spec.rb
      - spec/models/epic_ladder/tracker_hierarchy_spec.rb
      - spec/models/epic_ladder/issue_promoter_spec.rb
      - spec/models/epic_ladder/project_setting_spec.rb
      - spec/models/epic_ladder/mcp_tool_hint_spec.rb
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme

  - id: fc-mcp-tools
    name: Epic Ladder MCP tools and endpoints
    patterns:
      - lib/epic_ladder/mcp_tools/**/*.rb
      - app/controllers/mcp/**/*.rb
      - app/controllers/epic_ladder/claude_mcp_settings_controller.rb
      - app/views/epic_ladder/claude_mcp_settings/**/*.erb
      - lib/epic_ladder/claude_mcp_oauth_application.rb
      - spec/lib/epic_ladder/mcp_tools/**/*.rb
      - spec/controllers/mcp/**/*.rb
      - spec/requests/mcp/**/*.rb
      - spec/lib/epic_ladder/claude_mcp_oauth_application_spec.rb
      - spec/support/mcp_test_helpers.rb
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme

  - id: fc-issue-detail-hooks
    name: Issue detail quick actions
    patterns:
      - lib/epic_ladder/hooks/**/*.rb
      - app/views/hooks/**/*.erb
      - spec/lib/epic_ladder/hooks/**/*.rb
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme

  - id: fc-rails-integration
    name: Rails and Redmine integration source
    patterns:
      - app/controllers/**/*.rb
      - app/helpers/**/*.rb
      - app/models/concerns/**/*.rb
      - app/views/**/*.erb
      - config/**/*.rb
      - config/**/*.yml
      - lib/redmine_epic_ladder.rb
      - lib/epic_ladder/asset_deployer.rb
      - lib/epic_ladder/projects_helper_patch.rb
      - lib/kanban/**/*.rb
      - lib/tasks/**/*.rake
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme

  - id: fc-rails-tests
    name: Rails plugin tests
    patterns:
      - spec/**/*.rb
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme

  - id: fc-frontend-types
    name: Epic Ladder TypeScript type SSoT
    patterns:
      - assets/javascripts/epic_ladder/src/types/**
      - app/assets/javascripts/types/**/*.ts
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme
      - spec-epic-ladder-frontend-readme

  - id: fc-react-view
    name: Epic Ladder React view
    patterns:
      - assets/javascripts/epic_ladder/src/App.tsx
      - assets/javascripts/epic_ladder/src/App.test.tsx
      - assets/javascripts/epic_ladder/src/index.tsx
      - assets/javascripts/epic_ladder/src/index.production.tsx
      - assets/javascripts/epic_ladder/src/api/**
      - assets/javascripts/epic_ladder/src/components/**
      - assets/javascripts/epic_ladder/src/hooks/**
      - assets/javascripts/epic_ladder/src/integration/**
      - assets/javascripts/epic_ladder/src/mocks/**
      - assets/javascripts/epic_ladder/src/store/**
      - assets/javascripts/epic_ladder/src/test/**
      - assets/javascripts/epic_ladder/src/utils/**
      - assets/javascripts/epic_ladder/src/setupTests.ts
      - assets/javascripts/epic_ladder/src/test-setup.ts
      - assets/javascripts/epic_ladder/src/styles.scss
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme
      - spec-epic-ladder-frontend-readme

  - id: fc-frontend-tooling
    name: Epic Ladder frontend tooling
    patterns:
      - assets/javascripts/epic_ladder/README.md
      - assets/javascripts/epic_ladder/nested_grid_test_template.html
      - assets/javascripts/epic_ladder/public/**
      - assets/javascripts/epic_ladder/coverage-report.json
      - assets/javascripts/epic_ladder/package-lock.json
      - assets/javascripts/epic_ladder/package.json
      - assets/javascripts/epic_ladder/tsconfig.json
      - assets/javascripts/epic_ladder/tsconfig.production.json
      - assets/javascripts/epic_ladder/vitest.config.ts
      - assets/javascripts/epic_ladder/webpack.config.js
    severity: warn
    document_refs:
      - rule-mozyo-bridge-development-flow
      - spec-epic-ladder-readme
      - spec-epic-ladder-frontend-readme
